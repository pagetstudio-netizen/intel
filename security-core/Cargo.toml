[package]
name = "intel-security-core"
version = "0.1.0"
edition = "2021"
description = "INTEL - Pentest & Security Auditing Core Engine"

[[bin]]
name = "intel"
path = "src/main.rs"

[lib]
name = "intel_security_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
