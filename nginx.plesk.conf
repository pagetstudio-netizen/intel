# ─────────────────────────────────────────────────────────────────
# INTEL Security Platform — Configuration Nginx pour Plesk
# Copiez ce contenu dans :
#   Plesk > votre domaine > Apache & Nginx > Directives Nginx supplémentaires
# ─────────────────────────────────────────────────────────────────

# Servir le frontend React (fichiers statiques buildés)
root /var/www/vhosts/votredomaine.com/httpdocs/web-ui/dist;
index index.html;

# Proxy API vers le backend Node.js (port 3000)
location /api/ {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120s;
}

# SPA fallback — toutes les routes non-API servent index.html
location / {
    try_files $uri $uri/ /index.html;
}

# Sécurité — bloquer les fichiers sensibles
location ~ /\. {
    deny all;
}
location ~* \.(env|git|htaccess|config)$ {
    deny all;
}
